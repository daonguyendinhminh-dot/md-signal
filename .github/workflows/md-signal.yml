name: MD Signal Bot

on:
  schedule:
    - cron: "10 0 * * *"     # 07:10 giờ VN: quét tín hiệu (crypto vừa đóng nến ngày)
    - cron: "20 8 * * 1-5"   # 15:20 giờ VN thứ 2–6: quét tín hiệu sau khi HOSE đóng cửa
    - cron: "10 10 * * 1-5"  # 17:10 giờ VN thứ 2–6: đọc tin tức + BCTC bằng AI (giá DeepSeek thấp điểm)
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = quét tín hiệu · test = gửi bảng thử qua Telegram · news = đọc tin tức + BCTC"
        type: choice
        options: [scan, test, news]
        default: scan
  push:
    paths: ["app.html", "*.py"]

permissions:
  contents: write

concurrency:
  group: md-signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cài thư viện AI
        run: pip install --quiet scikit-learn numpy

      - name: Chạy MD Signal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '10 10 * * 1-5' && 'news') || 'scan' }}
        run: python md_signal.py

      - name: Lưu kết quả cho app
        if: always()
        run: |
          git config user.name "md-signal-bot"
          git config user.email "md-signal-bot@users.noreply.github.com"
          git add -A docs config.json || true
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "MD Signal: cập nhật $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y')"
          git pull --rebase --autostash || true
          git push
