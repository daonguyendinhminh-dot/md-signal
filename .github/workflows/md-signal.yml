name: MD Signal Bot

on:
  schedule:
    - cron: "10 0 * * *"     # 07:10 giờ VN mỗi ngày: nến ngày của crypto vừa đóng
    - cron: "20 8 * * 1-5"   # 15:20 giờ VN thứ 2–6: sau khi HOSE đóng cửa
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = quét bình thường · test = gửi bảng tổng hợp thử qua Telegram"
        type: choice
        options: [scan, test]
        default: scan
  push:
    paths: ["app.html", "md_signal.py"]

permissions:
  contents: write

concurrency:
  group: md-signal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Quét chỉ báo và báo Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'scan' }}
        run: python md_signal.py

      - name: Lưu kết quả cho app
        if: always()
        run: |
          git config user.name "md-signal-bot"
          git config user.email "md-signal-bot@users.noreply.github.com"
          git add -A docs config.json || true
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "MD Signal: cập nhật $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y')"
          git pull --rebase --autostash || true
          git push
